services:
  web:
    build: .
    image: apex-bord:latest
    container_name: apex-bord
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend  # live frontend edits (refresh browser, no rebuild)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
